# Adapted from spike-html-apps-tooling (d77877b): mise.toml, its pins at their latest.
# Adapted from spike-html-apps-foundation (7e5d6c2): mise.toml, with no demo or screenshots task.
# Adapted from spike-html-go-wasm (f026de3): mise.toml, its http:dejavu-fonts pin.
# The tooling's pins and tasks.
# See docs/development.md
[settings]
task.run_auto_install = false

[tools]
actionlint = "1.7.12"
node = "26.13.1"
pnpm = "12.21.0"
shellcheck = "0.11.0"
"github:microsoft/typescript-go" = { version = "7.0.2", version_prefix = "typescript/v", bin_path = "package/lib" }

[tools."http:chrome-headless-shell"]
version = "158.0.8127.36"
version_list_url = "https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions.json"
version_json_path = ".channels.Stable.version"

[tools."http:chrome-headless-shell".platforms]
linux-x64 = { url = "https://storage.googleapis.com/chrome-for-testing-public/{{ version }}/linux64/chrome-headless-shell-linux64.zip", checksum = "sha256:2d3a23017323c54fd457a678e4351f895c4076d8050e39d5aa6247f93448b73a", size = "132087165" }

[tools."http:dejavu-fonts"]
version = "2.37"
version_list_url = "https://api.github.com/repos/dejavu-fonts/dejavu-fonts/releases"
version_regex = 'dejavu-fonts-ttf-([0-9.]+)\.tar\.bz2'

[tools."http:dejavu-fonts".platforms]
linux-x64 = { url = "https://github.com/dejavu-fonts/dejavu-fonts/releases/download/version_{{ version | replace(from='.', to='_') }}/dejavu-fonts-ttf-{{ version }}.tar.bz2", checksum = "sha256:fa9ca4d13871dd122f61258a80d01751d603b4d3ee14095d65453b4e846e17d7", size = "5429777" }

[tasks.preflight]
description = "Fail naming mise run install when a tool the tasks need is missing, and with the browser argument the pinned chrome-headless-shell and DejaVu fonts"
hide = true
run = "scripts/preflight.sh"

[tasks.lint]
description = "Run the linters: ESLint, Prettier, shellcheck, and actionlint"
depends = ["lint:eslint", "lint:format", "lint:shell", "lint:workflows"]

[tasks."lint:eslint"]
description = "Lint with ESLint"
depends = ["preflight"]
run = "pnpm exec eslint ."

[tasks."lint:format"]
description = "Check the format with Prettier"
depends = ["preflight"]
run = "pnpm exec prettier --check ."

[tasks."lint:shell"]
description = "Shellcheck the scripts"
run = "shellcheck scripts/*.sh"

[tasks."lint:workflows"]
description = "Lint the GitHub Actions workflows with actionlint, which shellchecks each run: block with the pinned shellcheck"
run = "actionlint"

[tasks.types]
description = "Type-check the sources and the suite with tsc"
depends = ["types:src", "types:test"]

[tasks."types:src"]
description = "Type-check the sources with tsc"
run = "tsc --noEmit -p ."

[tasks."types:test"]
description = "Type-check the suite and the lint config with tsc, under tsconfig.test.json, against the build's declarations"
depends = ["build"]
run = "tsc -p tsconfig.test.json"

[tasks.build]
description = "Build src/ into dist/: tsc's emit, the bin made executable"
run = "scripts/build.sh"

[tasks."test:unit"]
description = "Run the unit tier on dist/, a pack of the build included"
depends = ["preflight", "build"]
run = "node --test 'test/unit/*.test.ts'"

[tasks."test:browser"]
description = "Run the browser tier on dist/ in the pinned chrome-headless-shell, each file in the machine's fonts or the pinned DejaVu set, which DEJAVU_FONTS names"
depends = ["preflight browser", "build"]
run = "BROWSER_EXECUTABLE=$(mise which chrome-headless-shell) DEJAVU_FONTS=$(mise where http:dejavu-fonts) node --test 'test/browser/*.test.ts'"

[tasks.check]
description = "Run every check; reads no network; writes dist/"
depends = ["lint", "types", "build", "test:unit", "test:browser"]

[tasks.install]
description = "Install the pins and node_modules; reads the network"
run = ["mise install", "pnpm install --frozen-lockfile"]

[tasks.currency]
description = "Report every mise tool, package.json pin, and action pin behind its latest, exiting nonzero if any"
run = "scripts/currency.sh"
quiet = true
