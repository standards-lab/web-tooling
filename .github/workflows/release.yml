# Adapted from spike-html-apps-tooling (d77877b): .github/workflows/release.yml, dispatched by hand with a pushed tag.
# Adapted from spike-html-apps-foundation (9c15b8d): .github/workflows/release.yml, renamed.
# Publishes the release a pushed vX.Y.Z tag cuts, dispatched by hand with the tag.
# See docs/release.md
# See docs/development.md
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The pushed vX.Y.Z tag to release
        required: true
        type: string

concurrency:
  group: release

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out every branch and tag
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Check out the pack commit's parent, a merge commit on main
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "$TAG isn't a vX.Y.Z tag" >&2
            exit 1
          fi
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          pack=$(git rev-parse "refs/tags/$TAG^{commit}")
          read -r -a line <<< "$(git rev-list --parents -n 1 "$pack")"
          parents=("${line[@]:1}")
          if [[ ${#parents[@]} -ne 1 ]]; then
            echo "$TAG's commit has ${#parents[@]} parents, not one" >&2
            exit 1
          fi
          read -r -a line <<< "$(git rev-list --parents -n 1 "${parents[0]}")"
          grandparents=$(( ${#line[@]} - 1 ))
          if [[ $grandparents -ne 2 ]]; then
            echo "$TAG's parent ${parents[0]} has $grandparents parents, not a merge commit's two" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "${parents[0]}" origin/main; then
            echo "$TAG's parent ${parents[0]} isn't on main" >&2
            exit 1
          fi
          git switch --detach "${parents[0]}"
          version=$(jq -r .version package.json)
          if [[ $TAG != "v$version" ]]; then
            echo "$TAG doesn't name package.json's version, $version" >&2
            exit 1
          fi

      - uses: jdx/mise-action@v5.2.10

      - name: mise run install
        run: mise run install

      - name: mise run check
        run: mise run check

      - name: Pack, and hold the tag's tree to the pack
        id: pack
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          scratch=$(mktemp -d)
          pnpm pack --pack-destination "$scratch"
          tarball=$(ls "$scratch"/*.tgz)
          tar -xzf "$tarball" -C "$scratch"
          mkdir "$scratch/tagged"
          git archive "refs/tags/$TAG" | tar -x -C "$scratch/tagged"
          diff -r "$scratch/package" "$scratch/tagged"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Create the GitHub release
        uses: taiki-e/create-gh-release-action@v1.12.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          changelog: CHANGELOG.md
          ref: refs/tags/${{ inputs.tag }}

      - name: Attach the tarball
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: gh release upload "$TAG" "$TARBALL"
