# The check on each pull request to main and each push to it, every pin installed first.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: jdx/mise-action@v5.3.0

      - name: mise run install
        run: mise run install

      - name: mise run check
        run: mise run check
