# Adapted from spike-html-apps-tooling (d77877b): .github/workflows/ci.yml, its pins at their
# latest. mise run install installs every pin mise.toml names, the DejaVu fonts included.
# From spike-html-apps-foundation (9c15b8d): .github/workflows/ci.yml.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: jdx/mise-action@v5.2.9

      - name: mise run install
        run: mise run install

      - name: mise run check
        run: mise run check
